<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyWorth</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
  <!-- Apply saved theme before paint to prevent flash -->
  <script>if(localStorage.getItem('mw_theme')==='dark')document.documentElement.classList.add('dark');</script>
</head>

<body>

  <!-- ── Header ── -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <img src="logo.svg" class="logo-icon" alt="" />
        MoneyWorth
      </div>
      <div class="header-actions" id="headerActions"></div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main>
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none">
        <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8" />
        <path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <input type="text" id="searchInput" placeholder="Search by title, location, or tag…" oninput="render()" />
      <button class="search-clear" id="searchClear" onclick="clearSearch()" title="Clear">&#215;</button>
    </div>
    <div class="sort-bar">
      <button class="sort-btn active" onclick="setSort('new', this)">&#128293; New</button>
      <button class="sort-btn" onclick="setSort('hot', this)">&#9889; Most Voted</button>
      <button class="sort-btn" onclick="setSort('up', this)">&#9650; Top Upvoted</button>
      <button class="sort-btn" onclick="setSort('down', this)">&#9660; Top Downvoted</button>
      <button class="sort-btn mine-btn" id="myPostsBtn" onclick="toggleMineFilter(this)">&#128100; My Posts</button>
    </div>
    <div class="feed" id="feed"></div>
  </main>

  <!-- ── New Post Modal ── -->
  <div class="overlay" id="overlay" onclick="onOverlayClick(event)">
    <div class="modal">
      <div class="modal-head">
        <h2>Create Post</h2>
        <button class="close-btn" onclick="closeModal()">&#215;</button>
      </div>
      <div class="modal-body">
        <form id="form" onsubmit="submitPost(event)">
          <div class="field">
            <label>Title <span class="required-star">*</span></label>
            <input type="text" id="fTitle" placeholder="Give your post a title…" maxlength="120"
              oninput="clearFieldError('titleError')" />
            <p class="field-error" id="titleError"></p>
          </div>
          <div class="field">
            <label>Description <span class="required-star">*</span></label>
            <textarea id="fDesc" placeholder="What do you want to say?" maxlength="600"
              oninput="clearFieldError('descError')"></textarea>
            <p class="field-error" id="descError"></p>
          </div>
          <div class="field">
            <label>Location <span class="required-star">*</span></label>
            <input type="text" id="fLocation" placeholder="Where is this?" maxlength="80"
              oninput="clearFieldError('locationError')" />
            <p class="field-error" id="locationError"></p>
          </div>
          <div class="field">
            <label>Tags</label>
            <div class="tag-input-wrap" id="tagWrap" onclick="document.getElementById('fTag').focus()">
              <div class="tag-pills" id="tagPills"></div>
              <input type="text" id="fTag" placeholder="Type a tag, press Enter or comma…" maxlength="30"
                onkeydown="onTagKeydown(event)" />
            </div>
          </div>
          <div class="field">
            <label>Images <span class="required-star">*</span></label>
            <div class="upload-zone" id="zone" onclick="document.getElementById('fImg').click()"
              ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave()">
              <input type="file" id="fImg" accept="image/*" multiple onchange="onFileSelect(event)" />
              <div class="upload-icon">🖼️</div>
              <div class="upload-hint"><b>Click to upload</b> or drag &amp; drop</div>
            </div>
            <div class="preview-grid" id="previewGrid"></div>
            <p class="field-error" id="imgError"></p>
          </div>
          <button type="submit" id="submitBtn" class="btn-submit">Share Post</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Login Modal ── -->
  <div class="overlay" id="loginOverlay" onclick="onLoginOverlayClick(event)">
    <div class="modal">
      <div class="modal-head">
        <h2>Login</h2>
        <button class="close-btn" onclick="closeLogin()">&#215;</button>
      </div>
      <div class="modal-body">
        <form id="loginForm" onsubmit="submitLogin(event)">
          <div class="field">
            <label>Username or Email</label>
            <input type="text" id="lIdentifier" placeholder="Enter username or email…" required autocomplete="username" />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="lPassword" placeholder="Enter your password…" required autocomplete="current-password" />
          </div>
          <div class="remember-row">
            <label class="remember-label">
              <input type="checkbox" id="lRemember" />
              Remember me
            </label>
          </div>
          <div class="auth-error" id="loginError"></div>
          <button type="submit" id="loginBtn" class="btn-submit">Login</button>
          <p class="auth-switch">Don't have an account? <button type="button" class="link-btn" onclick="switchToRegister()">Register</button></p>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Register Modal ── -->
  <div class="overlay" id="registerOverlay" onclick="onRegisterOverlayClick(event)">
    <div class="modal">
      <div class="modal-head">
        <h2>Create Account</h2>
        <button class="close-btn" onclick="closeRegister()">&#215;</button>
      </div>
      <div class="modal-body">
        <form id="registerForm" onsubmit="submitRegister(event)">
          <div class="field">
            <label>Email <span class="required-star">*</span></label>
            <input type="text" id="rEmail" placeholder="your@email.com" autocomplete="email"
              oninput="clearFieldError('rEmailError')" />
            <p class="field-error" id="rEmailError"></p>
          </div>
          <div class="field">
            <label>Username <span class="required-star">*</span></label>
            <input type="text" id="rUsername" placeholder="3–20 chars, letters/numbers/underscore" maxlength="20" autocomplete="username"
              oninput="clearFieldError('rUsernameError')" />
            <p class="field-error" id="rUsernameError"></p>
          </div>
          <div class="field">
            <label>Password <span class="required-star">*</span></label>
            <input type="password" id="rPassword" placeholder="At least 8 characters…" autocomplete="new-password"
              oninput="clearFieldError('rPasswordError')" />
            <p class="field-error" id="rPasswordError"></p>
          </div>
          <div class="field">
            <label>Confirm Password <span class="required-star">*</span></label>
            <input type="password" id="rConfirm" placeholder="Re-enter your password…" autocomplete="new-password"
              oninput="clearFieldError('rConfirmError')" />
            <p class="field-error" id="rConfirmError"></p>
          </div>
          <div class="auth-error" id="registerError"></div>
          <button type="submit" id="registerBtn" class="btn-submit">Create Account</button>
          <p class="auth-switch">Already have an account? <button type="button" class="link-btn" onclick="switchToLogin()">Login</button></p>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Delete Account Modal ── -->
  <div class="overlay" id="deleteAccountOverlay" onclick="onDeleteAccountOverlayClick(event)">
    <div class="modal">
      <div class="modal-head">
        <h2>Delete Account</h2>
        <button class="close-btn" onclick="closeDeleteAccount()">&#215;</button>
      </div>
      <div class="modal-body">
        <div class="da-warning">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="17" x2="12.01" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span>This will permanently delete your account and all your posts. This cannot be undone.</span>
        </div>
        <form id="deleteAccountForm" onsubmit="submitDeleteAccount(event)">
          <div class="field">
            <label>Enter your password to confirm</label>
            <input type="password" id="daPassword" placeholder="Your current password…"
              autocomplete="current-password" oninput="clearFieldError('daPasswordError')" />
            <p class="field-error" id="daPasswordError"></p>
          </div>
          <div class="auth-error" id="deleteAccountError"></div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="closeDeleteAccount()">Cancel</button>
            <button type="submit" id="deleteAccountBtn" class="btn-danger-submit">Delete My Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Delete Confirmation Dialog ── -->
  <div class="confirm-overlay" id="confirmOverlay" onclick="onConfirmOverlayClick(event)">
    <div class="confirm-dialog" id="confirmDialog">
      <div class="confirm-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h3 class="confirm-title">Delete Post?</h3>
      <p class="confirm-subtitle" id="confirmSubtitle"></p>
      <p class="confirm-note">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="confirm-cancel" onclick="closeConfirm()">Keep Post</button>
        <button class="confirm-delete" id="confirmDeleteBtn" onclick="confirmDeleteAction()">Delete</button>
      </div>
    </div>
  </div>

  <!-- ── Post Detail Modal ── -->
  <div class="overlay" id="detailOverlay" onclick="onDetailOverlayClick(event)">
    <div class="detail-modal" id="detailModal">
      <button class="close-btn detail-close" onclick="closePost()">&#215;</button>
      <div class="detail-img-panel" id="detailImgPanel"></div>
      <div class="detail-info-panel" id="detailInfoPanel"></div>
    </div>
  </div>

  <!-- ── New Post FAB ── -->
  <button class="fab-new-post" id="fabNewPost" onclick="openModal()" aria-label="New post">
    <svg viewBox="0 0 14 14" fill="none">
      <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    New Post
  </button>

  <!-- ── Theme toggle ── -->
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
    <!-- Sun: shown in dark mode (click → light) -->
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <!-- Moon: shown in light mode (click → dark) -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <script src="app.js"></script>
</body>

</html>
